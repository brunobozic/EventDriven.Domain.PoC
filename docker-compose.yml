version: '3.9'
services:
  #api: 
  #   build:
  #    context: ./
  #    dockerfile: ./EventDriven.Domain.PoC.Api.Rest/Dockerfile
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ASPNETCORE_URLS=http://+:80;https://+:443
  #     - ASPNETCORE_HTTP_PORT=6000
  #     - ASPNETCORE_HTTPS_PORT=6001 
  #     #- ASPNETCORE_Kestrel__Certificates__Default__Password=crypticpassword
  #     #- ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
  #   ports:
  #     - "6000:80"
  #     - "6001:443"
  #   networks:
  #    - jaeger-example
  jaeger:
    image: jaegertracing/all-in-one:1.37
    environment:
      - COLLECTOR_OTLP_ENABLED=true  # Enable OTLP receiver
    ports:
      - "5775:5775/udp"    # Zipkin thrift compact
      - "6831:6831/udp"    # Jaeger agent compact thrift
      - "6832:6832/udp"    # Jaeger agent binary thrift
      - "5778:5778"        # Config endpoint
      - "16686:16686"      # Jaeger UI
      - "14268:14268"      # Jaeger collector HTTP
      - "9411:9411"        # Zipkin
      - "4317:4317"        # OTLP gRPC
      - "4318:4318"        # OTLP HTTP
    networks:
      - jaeger-example
  eureka-server:
    image:  steeltoeoss/eureka-server
    hostname: eureka-server
    ports:
      - "8761:8761"
    networks:
      - jaeger-example
  kafkaui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8080:8080
    depends_on:
      - zookeeper
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - jaeger-example
  zookeeper:
    image: wurstmeister/zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    networks:
      - jaeger-example
  kafka:
    image: wurstmeister/kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    links: 
      - zookeeper
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ADVERTISED_PORT: "9094"
      KAFKA_CREATE_TOPICS: "user_event_stream:1:1,address_event_stream:1:1,role_event_stream:1:1,test_user_event_stream:1:1,identity-provider-event-stream:1:1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      HOSTNAME_COMMAND: "echo 127.0.0.1"
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:9094
      KAFKA_LISTENERS: INSIDE://:9092,OUTSIDE://:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
    
      KAFKA_INTER_BROKER_LISTENER_NAME: OUTSIDE
    volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jaeger-example
  consul-agent-1:
    image: consul:1.9.5
    networks:
      - consul-demo
    command: "agent -retry-join consul-server-bootstrap -client 0.0.0.0"

  consul-agent-2:
    # Complete copy of 'consul-agent-1'
    image: consul:1.9.5
    networks:
      - consul-demo
    command: "agent -retry-join consul-server-bootstrap -client 0.0.0.0"

  consul-agent-3:
    # Complete copy of 'consul-agent-1'
    image: consul:1.9.5
    networks:
      - consul-demo
    command: "agent -retry-join consul-server-bootstrap -client 0.0.0.0"

  consul-server-1:
    # Uses only image and networks from 'consul-agent-1'
    # while 'command' is overwritten
    image: consul:1.9.5
    networks:
      - consul-demo
    command: "agent -server -retry-join consul-server-bootstrap -client 0.0.0.0"

  consul-server-2:
    # Complete copy of 'consul-server-1'
    image: consul:1.9.5
    networks:
      - consul-demo
    command: "agent -server -retry-join consul-server-bootstrap -client 0.0.0.0"

  consul-server-bootstrap:
    # Uses only image and networks from 'consul-agent-1'
    # while 'command' is overwritten and 'ports' are defined
    image: consul:1.9.5
    networks:
      - consul-demo
    ports:
      - "8400:8400"
      - "8500:8500"
      - "8600:8600"
      - "8600:8600/udp"
    command: "agent -server -bootstrap-expect 3 -ui -client 0.0.0.0"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.11.2
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"
      - "9300:9300"

  logstash:
    image: docker.elastic.co/logstash/logstash:7.11.2
    ports:
      - "5000:5000"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:7.11.2
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  
  setup-kibana:
    image: curlimages/curl
    depends_on:
      - kibana
    command: >
      /bin/sh -c "
        until curl -s http://kibana:5601/api/status | grep -q 200
        do
          echo 'Waiting for Kibana...'
          sleep 5
        done;
        echo 'Kibana is up. Setting up index pattern...';
        curl -X POST 'http://kibana:5601/api/saved_objects/index-pattern/identityservice-api-*' -H 'kbn-xsrf: true' -H 'Content-Type: application/json' -d'
        {
          \"attributes\": {
            \"title\": \"identityservice-api-*\",
            \"timeFieldName\": \"@timestamp\"
          }
        }'
      "


networks:
  consul-demo:
  jaeger-example:
  consul:
    driver: bridge